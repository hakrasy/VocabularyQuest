<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOXELQUEST // Neo-Brutalism Pixel English Vocab Game</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Pixel & Neo-Brutalist Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Press+Start+2P&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       NEO-BRUTALISM X DIGITAL PIXEL DESIGN SYSTEM
       ========================================================================== */
    :root {
      --bg-paper: #FFFDF5;
      --ink-black: #111827;
      --brutal-yellow: #FFE600;
      --brutal-cyan: #00F0FF;
      --brutal-magenta: #FF2A85;
      --brutal-lime: #39FF14;
      --brutal-purple: #B57EDC;
      --brutal-orange: #FF8A00;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg-paper);
      color: var(--ink-black);
      /* Pixel dot grid background */
      background-image: radial-gradient(#111827 1.25px, transparent 1.25px);
      background-size: 22px 22px;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
      line-height: 1.45;
    }

    .font-mono-brutal {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Core Neo-Brutalist Card */
    .nb-card {
      background-color: #FFFFFF;
      border: 3px solid var(--ink-black);
      box-shadow: 5px 5px 0px var(--ink-black);
      border-radius: 6px;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .nb-card-lg {
      background-color: #FFFFFF;
      border: 4px solid var(--ink-black);
      box-shadow: 8px 8px 0px var(--ink-black);
      border-radius: 8px;
    }

    .nb-card-hover:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px var(--ink-black);
    }

    /* Core Neo-Brutalist Button */
    .nb-btn {
      border: 3px solid var(--ink-black);
      box-shadow: 4px 4px 0px var(--ink-black);
      border-radius: 6px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
      cursor: pointer;
      user-select: none;
    }

    .nb-btn:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px var(--ink-black);
    }

    .nb-btn:active:not(:disabled) {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px var(--ink-black);
    }

    .nb-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: 2px 2px 0px var(--ink-black);
    }

    /* Neo-Brutalist Input */
    .nb-input {
      border: 3px solid var(--ink-black);
      box-shadow: 4px 4px 0px var(--ink-black);
      border-radius: 6px;
      background: #FFFFFF;
      outline: none;
      transition: all 0.15s ease;
    }

    .nb-input:focus {
      background: #FFFBEB;
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px var(--ink-black);
    }

    /* Pixel Progress Bar with Diagonal Stripes */
    .nb-progress-track {
      border: 3px solid var(--ink-black);
      background-color: #E5E7EB;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .nb-progress-fill {
      height: 100%;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.22),
        rgba(255, 255, 255, 0.22) 8px,
        transparent 8px,
        transparent 16px
      );
    }

    /* Locked Folder Hatched Pattern */
    .locked-pattern {
      background-color: #E5E7EB;
      background-image: repeating-linear-gradient(
        45deg,
        #D1D5DB,
        #D1D5DB 10px,
        #E5E7EB 10px,
        #E5E7EB 20px
      );
    }

    /* Pixel Key / Anagram Tile */
    .pixel-tile {
      border: 3px solid var(--ink-black);
      box-shadow: 3px 3px 0px var(--ink-black);
      border-radius: 4px;
      font-family: 'Press Start 2P', monospace;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.06s ease, box-shadow 0.06s ease, background-color 0.1s ease;
    }

    .pixel-tile:active:not(:disabled) {
      transform: scale(0.95);
      box-shadow: 1px 1px 0px var(--ink-black);
    }

    /* Animations */
    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    @keyframes floatPixel {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .animate-pop {
      animation: popIn 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .animate-shake {
      animation: shakeError 0.35s ease-in-out;
    }

    .animate-float {
      animation: floatPixel 2.4s ease-in-out infinite;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #FFFDF5;
      border-left: 2px solid #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #FFE600;
      border: 2px solid #111827;
    }
  </style>
</head>

  <script type="module">

      getAuth,

      signInWithCustomToken,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

      getFirestore,
      doc,

    /* ==========================================================================
       0. FIREBASE BACKEND INITIALIZATION & REAL-TIME SYNC
       ========================================================================== */
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = {
  apiKey: "AIzaSyDNGS8iW3enDHBvPWzZdIBgG8VTfzvztiU",
  authDomain: "vocabularyquest-15fce.firebaseapp.com",
  projectId: "vocabularyquest-15fce",
  storageBucket: "vocabularyquest-15fce.firebasestorage.app",
  messagingSenderId: "25180915080",
  appId: "1:25180915080:web:9f67bd5661970780a8663d"
};

    let app = null;
    let auth = null;
    let db = null;
    let firebaseUser = null;
    let unsubscribeStudents = null;

    function getStudentsCollectionRef() {
      return collection(db, 'artifacts', appId, 'public', 'data', 'students');
    }

    function getStudentDocRef(studentId) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'students', studentId);
    }

    function normalizeUsername(raw) {
      return (raw || '')
        .trim()
        .toLowerCase()
        .replace(/\s+/g, '_')
        .replace(/[^a-z0-9_-]/g, '');
    }

    function formatLastActive(isoString) {
      if (!isoString) return 'Baru saja';
      const ts = Date.parse(isoString);
      if (Number.isNaN(ts)) return isoString;
      const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (diffSec < 60) return 'Baru saja';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin} menit lalu`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr} jam lalu`;
      const d = new Date(ts);
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    async function initFirebaseBackend() {
      if (!firebaseConfig) {
        State.dbStatus = 'OFFLINE';
        render();
        return;
      }
      try {
        State.dbStatus = 'CONNECTING';
        render();

        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // Authenticate first before any Firestore operation
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        firebaseUser = auth.currentUser;
        if (!firebaseUser) {
          await new Promise((resolve) => {
            const unsub = onAuthStateChanged(auth, (user) => {
              if (user) {
                firebaseUser = user;
                unsub();
                resolve();
              }
            });
          });
        }

        State.dbStatus = 'CONNECTED';
        subscribeToStudentsCollection();
        render();
      } catch (err) {
        console.error('Firebase initialization failed:', err);
        State.dbStatus = 'ERROR';
        showToast('Koneksi database gagal. Periksa jaringan Anda.', 'error');
        render();
      }
    }

    function subscribeToStudentsCollection() {
      if (!db || !firebaseUser) return;
      if (unsubscribeStudents) unsubscribeStudents();

      const colRef = getStudentsCollectionRef();
      unsubscribeStudents = onSnapshot(
        colRef,
        (snapshot) => {
          const syncedList = [];
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const uname = data.username || docSnap.id;
            syncedList.push({
              id: docSnap.id,
              username: uname,
              name: uname,
              className: data.className || '7',
              avatar: data.avatar || 'bot',
              unlockedFolderId: Number(data.unlockedFolderId) || 1,
              folderProgress: data.folderProgress || {},
              lastActiveAt: data.lastActiveAt || null,
              lastActive: formatLastActive(data.lastActiveAt || data.lastActive)
            });
          });
          State.students = syncedList;
          render();
        },
        (error) => {
          console.error('Firestore onSnapshot error:', error);
          State.dbStatus = 'ERROR';
          showToast('Gagal menyinkronkan data siswa secara real-time.', 'error');
          render();
        }
      );
    }

    /* ==========================================================================
       1. RETRO CHIPTUNE SOUND ENGINE (Web Audio API - Zero External URLs)
       ========================================================================== */
    const SoundFX = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, type = 'square', duration = 0.1, delay = 0, vol = 0.08) {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration);
        } catch (e) {
          // Ignore audio errors on restricted devices
        }
      },
      click() { this.playTone(520, 'square', 0.05, 0, 0.06); },
      tile() { this.playTone(660, 'triangle', 0.06, 0, 0.08); },
      correct() {
        this.playTone(523.25, 'square', 0.09, 0, 0.08);
        this.playTone(659.25, 'square', 0.09, 0.08, 0.08);
        this.playTone(783.99, 'square', 0.16, 0.16, 0.09);
      },
      wrong() {
        this.playTone(220, 'sawtooth', 0.14, 0, 0.09);
        this.playTone(175, 'sawtooth', 0.2, 0.12, 0.09);
      },
      victory() {
        const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
        const times = [0, 0.1, 0.2, 0.3, 0.45, 0.58];
        const durs  = [0.09, 0.09, 0.09, 0.14, 0.1, 0.32];
        notes.forEach((n, i) => this.playTone(n, 'square', durs[i], times[i], 0.09));
      }
    };

    /* ==========================================================================
       2. ENGLISH PRONUNCIATION ENGINE (Web Speech API)
       ========================================================================== */
    function speakWord(word, rate = 0.95) {
      try {
        if (!('speechSynthesis' in window)) {
          showToast('Browser tidak mendukung audio pelafalan otomatis.', 'warning');
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = rate;
        utterance.pitch = 1.02;
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang.includes('en-US')) || voices.find(v => v.lang.includes('en'));
        if (enVoice) utterance.voice = enVoice;
        window.speechSynthesis.speak(utterance);
      } catch (err) {
        console.warn('Speech synthesis fallback:', err);
      }
    }

    /* ==========================================================================
       3. PIXEL CONFETTI PARTICLE SYSTEM (HTML5 Canvas)
       ========================================================================== */
    const Confetti = {
      particles: [],
      running: false,
      canvas: null,
      ctx: null,
      launch() {
        this.canvas = document.getElementById('confetti-canvas');
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;

        const colors = ['#FFE600', '#00F0FF', '#FF2A85', '#39FF14', '#B57EDC', '#FF8A00'];
        this.particles = [];
        for (let i = 0; i < 130; i++) {
          this.particles.push({
            x: Math.random() * this.canvas.width,
            y: -20 - Math.random() * (this.canvas.height * 0.4),
            size: 8 + Math.floor(Math.random() * 8),
            color: colors[Math.floor(Math.random() * colors.length)],
            vx: (Math.random() - 0.5) * 6,
            vy: 3 + Math.random() * 5.5,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.2
          });
        }
        if (!this.running) {
          this.running = true;
          this.loop();
        }
      },
      loop() {
        if (!this.running || !this.ctx) return;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        let active = 0;
        for (const p of this.particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.08;
          p.rot += p.vrot;
          if (p.y < this.canvas.height + 30) {
            active++;
            this.ctx.save();
            this.ctx.translate(p.x, p.y);
            this.ctx.rotate(p.rot);
            this.ctx.fillStyle = p.color;
            this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            this.ctx.lineWidth = 2;
            this.ctx.strokeStyle = '#111827';
            this.ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size);
            this.ctx.restore();
          }
        }
        if (active > 0) {
          requestAnimationFrame(() => this.loop());
        } else {
          this.running = false;
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    };

          score: baseScore + ((i * 29) % 115),
          stars: i % 4 === 0 ? 2 : 3,
          accuracy: 86 + (i % 14)

      }
      return records;
    }

    function getCurrentStudent() {

    function computeStudentStats(student) {
      const entries = Object.values(student.folderProgress || {});
      const completedCount = entries.filter(e => e.completed).length;
      const totalScore = entries.reduce((sum, e) => sum + (e.score || 0), 0);
      const totalStars = entries.reduce((sum, e) => sum + (e.stars || 0), 0);
      const avgAccuracy = completedCount > 0
        ? Math.round(entries.reduce((sum, e) => sum + (e.accuracy || 0), 0) / completedCount)
        : 0;
      const progressPercent = Math.round((completedCount / CURRICULUM.length) * 100);
      return {
        completedCount,
        totalFolders: CURRICULUM.length,
        totalScore,
        totalStars,
        maxStars: CURRICULUM.length * 3,
        avgAccuracy,
        progressPercent
      };
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const bgMap = {
        info: 'bg-[#00F0FF]',
        success: 'bg-[#39FF14]',
        warning: 'bg-[#FFE600]',
        error: 'bg-[#FF2A85] text-white'
      };
      const toast = document.createElement('div');
      toast.className = `nb-card p-3.5 ${bgMap[type] || bgMap.info} pointer-events-auto animate-pop flex items-center justify-between gap-3 text-sm font-bold`;
      toast.innerHTML = `
        <span>${message}</span>
        <button onclick="this.parentElement.remove()" class="font-pixel text-xs px-1.5 py-0.5 border-2 border-black bg-white text-black">X</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 3400);
    }

    function openModal(htmlContent) {
      const overlay = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      content.innerHTML = htmlContent;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.add('hidden');
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Generate smart spelling distractors for Multiple Choice
    function generateSpellingDistractors(word) {
      const upper = word.toUpperCase();
      const set = new Set([upper]);
      const vowels = ['A', 'E', 'I', 'O', 'U'];

      // Mutation 1: Swap two adjacent middle letters
      if (upper.length >= 4) {
        const idx = Math.floor(upper.length / 2) - 1;
        const arr = upper.split('');
        [arr[idx], arr[idx + 1]] = [arr[idx + 1], arr[idx]];
        set.add(arr.join(''));
      }

      // Mutation 2: Replace a vowel
      for (let i = 1; i < upper.length; i++) {
        if (vowels.includes(upper[i])) {
          const altV = vowels.find(v => v !== upper[i]);
          const mutated = upper.slice(0, i) + altV + upper.slice(i + 1);
          set.add(mutated);
          if (set.size >= 3) break;
        }
      }

      // Mutation 3: Double or drop a consonant
      for (let i = 1; i < upper.length - 1; i++) {
        if (!vowels.includes(upper[i])) {
          if (upper[i] === upper[i + 1]) {
            set.add(upper.slice(0, i) + upper.slice(i + 1));
          } else {
            set.add(upper.slice(0, i) + upper[i] + upper.slice(i));
          }
          if (set.size >= 4) break;
        }
      }

      // Fallback mutations if word is very short (e.g. READ)
      let pad = 0;
      const suffixes = ['E', 'S', 'Y', 'ER'];
      while (set.size < 4 && pad < suffixes.length) {
        set.add(upper + suffixes[pad]);
        pad++;
      }

      return shuffleArray(Array.from(set).slice(0, 4));
    }

    // Generate Indonesian meaning options for Multiple Choice (English Audio -> Indonesian Meaning)
    function generateIndonesianOptions(targetWordObj, folderWords) {
      const sameFolderOthers = folderWords
        .filter(w => w.en !== targetWordObj.en)
        .map(w => w.id);
      const distractors = shuffleArray(sameFolderOthers).slice(0, 3);

      // Fallback from global curriculum if a folder ever has fewer than 4 words
      if (distractors.length < 3) {
        const extraPool = CURRICULUM.flatMap(f => f.words)
          .filter(w => w.en !== targetWordObj.en && !distractors.includes(w.id))
          .map(w => w.id);
        distractors.push(...shuffleArray(extraPool).slice(0, 3 - distractors.length));
      }

      return shuffleArray([targetWordObj.id, ...distractors]);
    }

    /* ==========================================================================
       8. QUEST ENGINE (3 Stages: ANAGRAM -> MULTIPLE CHOICE -> TYPING)
       ========================================================================== */
    function startFolderStudy(folderId) {
      const student = getCurrentStudent();
      if (!student) return;
      if (folderId > student.unlockedFolderId) {
        SoundFX.wrong();
        showToast(`🔒 Folder #${folderId} masih terkunci! Selesaikan folder sebelumnya dulu.`, 'warning');
        return;
      }
      SoundFX.click();
      State.activeFolderId = folderId;
      State.studyCardIndex = 0;
      State.view = 'STUDY_MODE';
      render();
      const folder = CURRICULUM.find(f => f.id === folderId);
      if (folder && folder.words[0]) {
        setTimeout(() => speakWord(folder.words[0].en), 250);
      }
    }

    function startFolderQuest(folderId) {
      const folder = CURRICULUM.find(f => f.id === folderId);
      if (!folder) return;
      SoundFX.click();

      // Build questions for each stage using all words in the folder
      const anagramPool = shuffleArray(folder.words).map(w => {
        let scrambled = shuffleArray(w.en.split(''));
        // Ensure scrambled isn't accidentally identical to original
        if (scrambled.join('') === w.en && w.en.length > 1) {
          scrambled.reverse();
        }
        return {
          wordObj: w,
          tiles: scrambled.map((char, idx) => ({ id: idx, char, used: false })),
          selectedTileIds: []
        };
      });

      const mcPool = shuffleArray(folder.words).map(w => ({
        wordObj: w,
        options: generateIndonesianOptions(w, folder.words),
        selectedOption: null,
        revealEnglish: false
      }));

      const typingPool = shuffleArray(folder.words).map(w => ({
        wordObj: w,
        userInput: ''
      }));

      State.quest = {
        folderId: folder.id,
        stage: 1, // 1 = ANAGRAM, 2 = MULTIPLE CHOICE, 3 = TYPING
        qIndex: 0,
        anagramPool,
        mcPool,
        typingPool,
        score: 0,
        streak: 0,
        maxStreak: 0,
        correctFirstTry: 0,
        totalQuestions: folder.words.length * 3,
        attemptedCurrent: false,
        feedbackState: null // null | 'CORRECT' | 'WRONG'
      };

      State.view = 'QUEST_MODE';
      render();
      setTimeout(() => speakWord(anagramPool[0].wordObj.en), 250);
    }

    function getCurrentQuestItem() {
      const q = State.quest;
      if (!q) return null;
      if (q.stage === 1) return q.anagramPool[q.qIndex];
      if (q.stage === 2) return q.mcPool[q.qIndex];
      return q.typingPool[q.qIndex];
    }

    function handleAnagramTilePick(tileId) {
      const q = State.quest;
      if (!q || q.stage !== 1 || q.feedbackState === 'CORRECT') return;
      const item = q.anagramPool[q.qIndex];
      const tile = item.tiles.find(t => t.id === tileId);
      if (!tile || tile.used) return;
      SoundFX.tile();
      tile.used = true;
      item.selectedTileIds.push(tileId);
      q.feedbackState = null;
      render();
    }

    function handleAnagramSlotRemove(slotPos) {
      const q = State.quest;
      if (!q || q.stage !== 1 || q.feedbackState === 'CORRECT') return;
      const item = q.anagramPool[q.qIndex];
      const tileId = item.selectedTileIds[slotPos];
      if (tileId === undefined) return;
      SoundFX.click();
      const tile = item.tiles.find(t => t.id === tileId);
      if (tile) tile.used = false;
      item.selectedTileIds.splice(slotPos, 1);
      q.feedbackState = null;
      render();
    }

    function clearAnagramSelection() {
      const q = State.quest;
      if (!q || q.stage !== 1) return;
      SoundFX.click();
      const item = q.anagramPool[q.qIndex];
      item.tiles.forEach(t => (t.used = false));
      item.selectedTileIds = [];
      q.feedbackState = null;
      render();
    }

    function submitQuestAnswer(overrideValue = null) {
      const q = State.quest;
      if (!q || q.feedbackState === 'CORRECT') return;
      const item = getCurrentQuestItem();
      const targetAnswer = (q.stage === 2 ? item.wordObj.id : item.wordObj.en).trim().toUpperCase();
      let userAnswer = '';

      if (q.stage === 1) {
        userAnswer = item.selectedTileIds
          .map(id => item.tiles.find(t => t.id === id)?.char || '')
          .join('');
        if (userAnswer.length < targetAnswer.length) {
          showToast('Lengkapi semua huruf pada slot anagram!', 'warning');
          return;
        }
      } else if (q.stage === 2) {
        if (overrideValue === null || overrideValue === undefined) return;
        const chosenOption = item.options[overrideValue];
        if (!chosenOption) return;
        item.selectedOption = chosenOption;
        userAnswer = chosenOption.trim().toUpperCase();
      } else if (q.stage === 3) {
        const inputEl = document.getElementById('typing-quest-input');
        userAnswer = (overrideValue !== null ? overrideValue : (inputEl ? inputEl.value : '')).trim().toUpperCase();
        item.userInput = userAnswer;
        if (!userAnswer) {
          showToast('Ketik ejaan katanya terlebih dahulu!', 'warning');
          return;
        }
      }

      if (userAnswer === targetAnswer) {
        SoundFX.correct();
        speakWord(item.wordObj.en);
        q.feedbackState = 'CORRECT';
        if (!q.attemptedCurrent) {
          q.correctFirstTry += 1;
          q.streak += 1;
          if (q.streak > q.maxStreak) q.maxStreak = q.streak;
          q.score += 20 + Math.min(q.streak * 2, 10);
        } else {
          q.score += 10;
        }
        render();
        setTimeout(() => advanceQuestStep(), 1050);
      } else {
        SoundFX.wrong();
        if (q.stage === 2) {
          speakWord(item.wordObj.en);
        }
        q.feedbackState = 'WRONG';
        q.attemptedCurrent = true;
        q.streak = 0;
        render();
      }
    }

    function toggleMultipleChoiceHint() {
      const q = State.quest;
      if (!q || q.stage !== 2) return;
      const item = q.mcPool[q.qIndex];
      if (!item) return;
      SoundFX.tile();
      item.revealEnglish = !item.revealEnglish;
      render();
    }

    async function advanceQuestStep() {
      const q = State.quest;
      if (!q) return;
      const folder = CURRICULUM.find(f => f.id === q.folderId);
      if (!folder) return;

      q.feedbackState = null;
      q.attemptedCurrent = false;

      if (q.qIndex < folder.words.length - 1) {
        q.qIndex += 1;
        render();
        const nextItem = getCurrentQuestItem();
        if (nextItem) speakWord(nextItem.wordObj.en);
        return;
      }

      // Move to next stage (1 -> 2 -> 3)
      if (q.stage < 3) {
        q.stage += 1;
        q.qIndex = 0;
        render();
        const nextItem = getCurrentQuestItem();
        if (nextItem) speakWord(nextItem.wordObj.en);
        return;
      }

      // All 3 stages completed: compute stars, update score & unlock next folder
      const student = getCurrentStudent();
      const accuracy = Math.round((q.correctFirstTry / q.totalQuestions) * 100);
      const stars = accuracy >= 90 ? 3 : accuracy >= 70 ? 2 : 1;
      const finalScore = q.score + stars * 20;

      let newlyUnlockedFolder = null;
      if (student) {
        const prevRecord = student.folderProgress[folder.id];
        student.folderProgress[folder.id] = {
          completed: true,
          score: prevRecord ? Math.max(prevRecord.score, finalScore) : finalScore,
          stars: prevRecord ? Math.max(prevRecord.stars, stars) : stars,
          accuracy: prevRecord ? Math.max(prevRecord.accuracy, accuracy) : accuracy
        };
        const nowIso = new Date().toISOString();
        student.lastActiveAt = nowIso;
        student.lastActive = 'Baru saja';

        if (folder.id === student.unlockedFolderId && folder.id < CURRICULUM.length) {
          student.unlockedFolderId = folder.id + 1;
          newlyUnlockedFolder = CURRICULUM.find(f => f.id === student.unlockedFolderId) || null;
          if (newlyUnlockedFolder) {
            State.selectedLevel = newlyUnlockedFolder.level;
          }
        }

        // Persist updated student progress to Firestore
        if (db && firebaseUser) {
          State.isSavingProgress = true;
          try {
            await setDoc(
              getStudentDocRef(student.id),
              {
                username: student.username,
                className: student.className,
                avatar: student.avatar,
                unlockedFolderId: student.unlockedFolderId,
                folderProgress: student.folderProgress,
                lastActiveAt: nowIso
              },
              { merge: true }
            );
          } catch (err) {
            console.error('Error saving quest progress:', err);
            showToast('Gagal menyimpan progress ke cloud. Periksa koneksi.', 'error');
          } finally {
            State.isSavingProgress = false;
          }
        }
      }

      State.lastQuestSummary = {
        folder,
        finalScore,
        accuracy,
        stars,
        maxStreak: q.maxStreak,
        newlyUnlockedFolder
      };

      State.quest = null;
      State.view = 'QUEST_COMPLETE';
      SoundFX.victory();
      Confetti.launch();
      render();
    }

    async function handleStudentLogin(e) {
      e.preventDefault();
      if (State.isLoggingIn) return;

      const usernameInput = document.getElementById('login-student-username');
      const classInput = document.getElementById('login-student-class');
      const rawUsername = (usernameInput?.value || '').trim();
      const docId = normalizeUsername(rawUsername);
      const selectedClass = (classInput?.value || '7').trim().toUpperCase();

      if (!docId || docId.length < 3) {
        showToast('Username minimal 3 karakter (huruf, angka, atau underscore)!', 'warning');
        return;
      }

      if (!db || !firebaseUser) {
        showToast('Database sedang menghubungkan, tunggu sebentar...', 'warning');
        return;
      }

      State.isLoggingIn = true;
      render();

      try {
        const studentRef = getStudentDocRef(docId);
        const snap = await getDoc(studentRef);
        const nowIso = new Date().toISOString();

        let studentRecord = null;
        let isReturning = false;

        if (snap.exists()) {
          // Existing username found -> load saved progress
          isReturning = true;
          const data = snap.data();
          studentRecord = {
            id: docId,
            username: data.username || rawUsername,
            name: data.username || rawUsername,
            className: data.className || selectedClass,
            avatar: State.selectedAvatar || data.avatar || 'bot',
            unlockedFolderId: Number(data.unlockedFolderId) || 1,
            folderProgress: data.folderProgress || {},
            lastActiveAt: nowIso,
            lastActive: 'Baru saja'
          };

          await setDoc(
            studentRef,
            {
              avatar: studentRecord.avatar,
              lastActiveAt: nowIso
            },
            { merge: true }
          );
        } else {
          // First-time username -> create and save new profile in Firestore
          studentRecord = {
            id: docId,
            username: rawUsername,
            name: rawUsername,
            className: selectedClass,
            avatar: State.selectedAvatar,
            unlockedFolderId: 1,
            folderProgress: {},
            createdAt: nowIso,
            lastActiveAt: nowIso,
            lastActive: 'Baru saja'
          };

          await setDoc(studentRef, {
            username: studentRecord.username,
            className: studentRecord.className,
            avatar: studentRecord.avatar,
            unlockedFolderId: 1,
            folderProgress: {},
            createdAt: nowIso,
            lastActiveAt: nowIso
          });
        }

        // Ensure local state reflects immediately before snapshot arrives
        const idx = State.students.findIndex(s => s.id === docId);
        if (idx >= 0) {
          State.students[idx] = studentRecord;
        } else {
          State.students.unshift(studentRecord);
        }

        SoundFX.correct();
        State.role = 'STUDENT';
        State.currentStudentId = docId;
        State.selectedLevel = CURRICULUM.find(f => f.id === studentRecord.unlockedFolderId)?.level || 1;
        State.view = 'STUDENT_HUB';

        if (isReturning) {
          showToast(`Selamat datang kembali, @${studentRecord.username}! Progress terakhir dimuat. 🚀`, 'success');
        } else {
          showToast(`Username @${studentRecord.username} berhasil terdaftar & tersimpan! 🎉`, 'success');
        }
      } catch (err) {
        console.error('Student login error:', err);
        SoundFX.wrong();
        showToast('Gagal memproses login username. Silakan coba lagi.', 'error');
      } finally {
        State.isLoggingIn = false;
        render();
      }
    }

    // ---------- VIEW 2: STUDENT HUB (CARD SCORE, FOLDERS, LEADERBOARD) ----------
    function renderStudentHub() {
      const student = getCurrentStudent();
      if (!student) return renderLoginView();
      const stats = computeStudentStats(student);

      const levelFolders = CURRICULUM.filter(f => f.level === State.selectedLevel);
      const levelCompleted = levelFolders.filter(f => student.folderProgress[f.id]?.completed).length;
      const levelPercent = Math.round((levelCompleted / levelFolders.length) * 100);

      // Render Folder Cards
      const folderCardsHtml = levelFolders.map(folder => {
        const record = student.folderProgress[folder.id];
        const isCompleted = Boolean(record?.completed);
        const isUnlocked = folder.id <= student.unlockedFolderId;
        const isCurrentTarget = folder.id === student.unlockedFolderId && !isCompleted;

        if (!isUnlocked) {
          return `
            <div onclick="startFolderStudy(${folder.id})" class="nb-card locked-pattern p-4 cursor-pointer opacity-85 flex flex-col justify-between min-h-[195px]">
              <div class="flex items-center justify-between">
                <span class="font-mono-brutal text-xs font-bold px-2 py-0.5 bg-gray-800 text-white rounded">FOLDER #${folder.id}</span>

              <div class="my-3">
                <div class="text-[11px] font-extrabold uppercase text-gray-600">${folder.pos}</div>
                <h3 class="text-lg font-extrabold text-gray-700">${folder.title}</h3>
                <p class="text-xs font-semibold text-gray-600">${folder.subtitle}</p>
              </div>
              <div class="text-[11px] font-bold bg-white/80 border-2 border-black px-2 py-1.5 rounded text-center">
                Selesaikan Folder #${folder.id - 1} dulu
              </div>
            </div>
          `;
        }

        return `
          <div
            onclick="startFolderStudy(${folder.id})"
            class="nb-card nb-card-hover p-4 cursor-pointer flex flex-col justify-between min-h-[195px] relative ${isCurrentTarget ? 'ring-4 ring-[#FF2A85]' : ''}"
            style="background-color: ${isCompleted ? '#FFFFFF' : folder.color};"
          >
            ${isCurrentTarget ? `
              <div class="absolute -top-3 right-3 bg-[#FF2A85] text-white font-pixel text-[9px] px-2 py-1 border-2 border-black shadow-[2px_2px_0px_#111827]">
                NEXT QUEST!
              </div>
            ` : ''}

            <div class="flex items-center justify-between gap-2">
              <span class="font-mono-brutal text-xs font-extrabold px-2 py-0.5 bg-black text-white rounded">
                #${folder.id} • ${folder.pos}
              </span>
              <span class="text-2xl">${folder.icon}</span>
            </div>

            <div class="my-3">
              <h3 class="text-lg font-extrabold leading-tight">${folder.title}</h3>
              <p class="text-xs font-bold text-gray-800 mt-0.5">${folder.subtitle}</p>
              <div class="text-[11px] font-mono-brutal font-bold mt-2 inline-block bg-white/90 px-2 py-0.5 border-2 border-black rounded">
                ${folder.words.length} Kosakata
              </div>
            </div>

            ${isCompleted ? `
              <div class="pt-2 border-t-2 border-black flex items-center justify-between">
                <div class="text-sm font-extrabold text-amber-500 drop-shadow-[1px_1px_0px_#000]">
                  ${'★'.repeat(record.stars)}${'☆'.repeat(3 - record.stars)}
                </div>
                <span class="font-mono-brutal text-xs font-extrabold bg-[#39FF14] px-2 py-0.5 border-2 border-black rounded">
                  ${record.score} XP
                </span>
              </div>
            ` : `
              <button type="button" class="nb-btn bg-white w-full py-2 text-xs">
                BUKA FOLDER ▶
              </button>
            `}
          </div>
        `;
      }).join('');

      // Leaderboard Ranking
      const rankedStudents = [...State.students]
        .map(s => ({ ...s, stats: computeStudentStats(s) }))
        .sort((a, b) => b.stats.totalScore - a.stats.totalScore);

      const leaderboardHtml = rankedStudents.map((s, idx) => {
        const av = getAvatarObj(s.avatar);
        const isMe = s.id === student.id;
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
        return `
          <div class="p-2.5 border-3 border-black rounded flex items-center justify-between gap-2 ${isMe ? 'bg-[#FFE600]' : 'bg-white'}" style="border-width:3px;">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="font-pixel text-xs w-7 text-center shrink-0">${medal}</span>
              <span class="text-xl shrink-0">${av.emoji}</span>
              <div class="truncate">
                <div class="text-xs font-extrabold truncate">@${s.username} ${isMe ? '(Kamu)' : ''}</div>
                <div class="text-[10px] font-mono-brutal font-bold text-gray-700">Kls ${s.className} • ${s.stats.completedCount}/21 Folder</div>
              </div>
            </div>
            <div class="font-mono-brutal font-extrabold text-xs bg-black text-[#39FF14] px-2 py-1 rounded shrink-0">
              ${s.stats.totalScore} XP
            </div>
          </div>
        `;
      }).join('');

              <div class="text-xs font-bold mt-1">Bintang: ${stats.totalStars} / ${stats.maxStars} ★</div>
            </div>

            <div class="nb-card p-4 bg-[#00F0FF]">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold uppercase">FOLDER TERBUKA</span>

              <div class="text-xs font-bold mt-1">Selesai: ${stats.completedCount} Folder</div>
            </div>

            <div class="nb-card p-4 bg-[#39FF14]">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold uppercase">AKURASI EJAAN</span>
                <span class="text-xl">🎯</span>
              </div>
              <div class="font-pixel text-xl sm:text-2xl mt-2">${stats.avgAccuracy}%</div>
              <div class="text-xs font-bold mt-1">Rata-rata Quest Selesai</div>
            </div>

            <div class="nb-card p-4 bg-white">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-extrabold uppercase">OVERALL PROGRESS</span>
                <span class="font-pixel text-xs">${stats.progressPercent}%</span>
              </div>
              <div class="nb-progress-track h-6 w-full">
                <div class="nb-progress-fill bg-[#FF2A85]" style="width: ${stats.progressPercent}%"></div>
              </div>
              <div class="text-[11px] font-bold text-gray-700 mt-2">
                Buka semua folder dari Level 1 hingga Level 3!
              </div>
            </div>
          </section>

          <!-- MAIN WORKSPACE: FOLDERS + LEADERBOARD -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- Left 8 Columns: Level Selector & Folder Grid -->
            <div class="lg:col-span-8 space-y-5">
              <!-- Level Tabs -->
              <div class="nb-card p-4 bg-white">
                <div class="grid grid-cols-3 gap-2 sm:gap-3">
                  ${[1, 2, 3].map(lvl => {
                    const active = State.selectedLevel === lvl;
                    const titles = { 1: 'BASIC', 2: 'EXPLORER', 3: 'MASTER' };
                    return `
                      <button
                        onclick="State.selectedLevel=${lvl}; SoundFX.click(); render();"
                        class="nb-btn py-3 px-2 text-center ${active ? 'bg-[#FFE600]' : 'bg-gray-100'}"
                      >
                        <div class="font-pixel text-[10px] sm:text-xs">LEVEL ${lvl}</div>

                  <span class="text-xs font-extrabold">Progress Level ${State.selectedLevel}: ${levelCompleted}/${levelFolders.length} Folder</span>
                  <div class="nb-progress-track h-4 w-full sm:w-56">
                    <div class="nb-progress-fill bg-[#39FF14]" style="width: ${levelPercent}%"></div>
                  </div>

              <!-- Folder Cards Grid -->
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                ${folderCardsHtml}

            </div>

            <!-- Right 4 Columns: Live Leaderboards -->
            <aside class="lg:col-span-4 space-y-4">
              <div class="nb-card-lg p-5 bg-white">
                <div class="flex items-center justify-between border-b-4 border-black pb-3 mb-4">

        return `

    // ---------- VIEW 4: QUEST MODE (3 STAGES) ----------
    function renderQuestMode() {
      const q = State.quest;
      if (!q) return renderStudentHub();
      const folder = CURRICULUM.find(f => f.id === q.folderId);
      const item = getCurrentQuestItem();
      const wordObj = item.wordObj;

      const stageNames = {
        1: 'STAGE 1/3: ANAGRAM (SUSUN HURUF)',
        2: 'STAGE 2/3: MULTIPLE CHOICE (DENGAR & PILIH ARTI)',
        3: 'STAGE 3/3: TYPING THE WORDS (KETIK KATA)'
      };

      const stageColors = {
        1: '#FFE600',
        2: '#00F0FF',
        3: '#FF2A85'
      };

      const completedSteps = (q.stage - 1) * folder.words.length + q.qIndex;
      const questPercent = Math.round((completedSteps / q.totalQuestions) * 100);

      let stageBodyHtml = '';

      // --- STAGE 1: ANAGRAM ---
      if (q.stage === 1) {
        const slotsHtml = wordObj.en.split('').map((_, idx) => {
          const tileId = item.selectedTileIds[idx];
          const tile = tileId !== undefined ? item.tiles.find(t => t.id === tileId) : null;
          return `
            <button
              type="button"
              onpointerdown="if (event.button === 0 || event.pointerType !== 'mouse') { event.preventDefault(); handleAnagramSlotRemove(${idx}); }"
              onclick="if (event.detail === 0) handleAnagramSlotRemove(${idx})"
              class="w-11 h-13 sm:w-13 sm:h-15 min-w-[44px] min-h-[52px] border-3 border-black rounded flex items-center justify-center font-pixel text-base sm:text-lg touch-manipulation select-none transition-colors ${tile ? 'bg-[#FFE600] shadow-[3px_3px_0px_#111827] cursor-pointer active:scale-95' : 'bg-gray-100 border-dashed'}"
              style="border-width:3px;"
            >
              <span class="pointer-events-none">${tile ? tile.char : ''}</span>
            </button>
          `;
        }).join('');

        const scrambledTilesHtml = item.tiles.map(tile => `
          <button
            type="button"
            onpointerdown="if (event.button === 0 || event.pointerType !== 'mouse') { event.preventDefault(); handleAnagramTilePick(${tile.id}); }"
            onclick="if (event.detail === 0) handleAnagramTilePick(${tile.id})"
            ${tile.used ? 'disabled' : ''}
            class="pixel-tile w-12 h-14 sm:w-14 sm:h-16 flex items-center justify-center text-base sm:text-xl ${tile.used ? 'bg-gray-200 opacity-30 cursor-not-allowed shadow-none' : 'bg-[#00F0FF] hover:bg-[#39FF14] cursor-pointer'}"
          >
            <span class="pointer-events-none">${tile.char}</span>
          </button>
        `).join('');

        stageBodyHtml = `
          <div class="space-y-6">
            <div class="text-center">
              <span class="text-xs font-extrabold uppercase text-gray-500">Susun huruf menjadi kata bahasa Inggris untuk:</span>
              <h3 class="text-2xl sm:text-3xl font-extrabold mt-1">${wordObj.id}</h3>
              <div class="mt-2 flex items-center justify-center gap-2">
                <span class="font-mono-brutal text-xs font-bold bg-gray-100 px-2.5 py-1 border-2 border-black rounded">${wordObj.phonetic}</span>
                <button type="button" onclick="speakWord('${wordObj.en}')" class="nb-btn bg-[#00F0FF] px-3 py-1 text-xs">
                  🔊 DENGAR SUARA
                </button>
              </div>
            </div>

            <!-- Answer Slots -->
            <div class="flex flex-wrap items-center justify-center gap-2 ${q.feedbackState === 'WRONG' ? 'animate-shake' : ''}">
              ${slotsHtml}
            </div>

            <!-- Scrambled Letter Tiles -->
            <div class="p-4 bg-[#FFFDF5] border-3 border-black rounded flex flex-wrap items-center justify-center gap-2.5" style="border-width:3px;">
              ${scrambledTilesHtml}
            </div>

            ${q.feedbackState === 'WRONG' ? `
              <div class="p-3 bg-[#FF2A85] text-white border-3 border-black rounded text-center text-xs font-bold" style="border-width:3px;">
                ❌ Urutan huruf belum tepat! Klik huruf di kotak atas untuk menghapus atau coba susun ulang.
              </div>
            ` : ''}

            <div class="flex flex-wrap items-center justify-center gap-3">
              <button type="button" onclick="clearAnagramSelection()" class="nb-btn bg-white px-4 py-3 text-xs">
                ↺ RESET HURUF
              </button>
              <button type="button" onclick="submitQuestAnswer()" class="nb-btn bg-[#39FF14] px-6 py-3 font-pixel text-xs">
                CEK JAWABAN ✓
              </button>
            </div>
          </div>
        `;
      }

      // --- STAGE 2: MULTIPLE CHOICE (ENGLISH AUDIO -> INDONESIAN MEANING) ---
      if (q.stage === 2) {
        const letters = ['A', 'B', 'C', 'D'];
        const optionsHtml = item.options.map((opt, idx) => {
          let btnBg = 'bg-white hover:bg-[#FFFBEB]';
          if (item.selectedOption === opt) {
            if (q.feedbackState === 'CORRECT') btnBg = 'bg-[#39FF14]';
            else if (q.feedbackState === 'WRONG') btnBg = 'bg-[#FF2A85] text-white animate-shake';
          }
          return `
            <button
              type="button"
              onclick="submitQuestAnswer(${idx})"
              class="nb-btn p-4 text-left flex items-center gap-3 ${btnBg}"
            >
              <span class="w-8 h-8 border-2 border-black bg-[#FFE600] text-black flex items-center justify-center font-pixel text-xs shrink-0">
                ${letters[idx]}
              </span>
              <span class="text-sm sm:text-base font-extrabold">${opt}</span>
            </button>
          `;
        }).join('');

        stageBodyHtml = `
          <div class="space-y-6">
            <div class="text-center">
              <span class="text-xs font-extrabold uppercase text-gray-500">Dengarkan kata bahasa Inggris berikut, lalu pilih artinya dalam bahasa Indonesia:</span>

              <!-- Audio Pronunciation Prompt Box -->
              <div class="mt-3 p-5 bg-[#FFFDF5] border-3 border-black rounded max-w-md mx-auto space-y-3" style="border-width:3px;">
                <div class="flex items-center justify-center gap-2">
                  <span class="text-3xl animate-bounce">🔊</span>
                  <span class="font-pixel text-xs sm:text-sm">
                    ${q.feedbackState === 'CORRECT' || item.revealEnglish ? wordObj.en : '??? (DENGARKAN AUDIO)'}
                  </span>
                </div>

                ${q.feedbackState === 'CORRECT' || item.revealEnglish ? `
                  <div class="font-mono-brutal text-xs font-bold text-gray-700">
                    Cara Baca: ${wordObj.phonetic}
                  </div>
                ` : ''}

                <div class="flex flex-wrap items-center justify-center gap-2 pt-1">
                  <button type="button" onclick="speakWord('${wordObj.en}', 0.95)" class="nb-btn bg-[#00F0FF] px-3.5 py-2 text-xs">
                    🔊 PUTAR ULANG
                  </button>
                  <button type="button" onclick="speakWord('${wordObj.en}', 0.65)" class="nb-btn bg-[#FFE600] px-3.5 py-2 text-xs">
                    🐢 PELAN
                  </button>
                  <button type="button" onclick="toggleMultipleChoiceHint()" class="nb-btn bg-white px-3 py-2 text-xs">
                    ${item.revealEnglish ? '🙈 SEMBUNYIKAN TEKS' : '👁️ INTIP KATA'}
                  </button>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              ${optionsHtml}
            </div>

            ${q.feedbackState === 'CORRECT' ? `
              <div class="p-3 bg-[#39FF14] text-black border-3 border-black rounded text-center text-xs font-extrabold" style="border-width:3px;">
                ✅ Tepat sekali! "${wordObj.en}" (${wordObj.phonetic}) artinya "${wordObj.id}".
              </div>
            ` : ''}

            ${q.feedbackState === 'WRONG' ? `
              <div class="p-3 bg-[#FF2A85] text-white border-3 border-black rounded text-center text-xs font-bold" style="border-width:3px;">
                ❌ Arti kata belum tepat! Dengarkan kembali pelafalan bahasa Inggrisnya dan pilih arti Indonesia yang benar.
              </div>
            ` : ''}
          </div>
        `;
      }

      // --- STAGE 3: TYPING THE WORDS ---
      if (q.stage === 3) {
        const maskedHint = wordObj.en[0] + ' ' + '_ '.repeat(wordObj.en.length - 1).trim();
        stageBodyHtml = `
          <form onsubmit="event.preventDefault(); submitQuestAnswer();" class="space-y-6">
            <div class="text-center">
              <span class="text-xs font-extrabold uppercase text-gray-500">Dengarkan & Ketik Ejaan Bahasa Inggrisnya:</span>
              <h3 class="text-2xl sm:text-3xl font-extrabold mt-1">${wordObj.id}</h3>
              <div class="mt-3 flex flex-wrap items-center justify-center gap-2">
                <span class="font-mono-brutal text-xs font-bold bg-gray-100 px-2.5 py-1 border-2 border-black rounded">
                  ${wordObj.phonetic}
                </span>
                <span class="font-mono-brutal text-xs font-bold bg-[#FFFBEB] px-2.5 py-1 border-2 border-black rounded">
                  Petunjuk: ${maskedHint} (${wordObj.en.length} huruf)
                </span>
                <button type="button" onclick="speakWord('${wordObj.en}')" class="nb-btn bg-[#00F0FF] px-3 py-1.5 text-xs">
                  🔊 DENGAR KATA
                </button>
              </div>
            </div>

            <div class="max-w-md mx-auto">
              <input
                id="typing-quest-input"
                type="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                value="${item.userInput}"
                placeholder="KETIK KATA DI SINI..."
                class="nb-input w-full px-4 py-4 text-center font-pixel text-lg sm:text-xl uppercase tracking-widest ${q.feedbackState === 'WRONG' ? 'animate-shake bg-red-100' : q.feedbackState === 'CORRECT' ? 'bg-[#39FF14]/40' : ''}"
              />
            </div>

            ${q.feedbackState === 'WRONG' ? `
              <div class="p-3 bg-[#FF2A85] text-white border-3 border-black rounded text-center text-xs font-bold max-w-md mx-auto" style="border-width:3px;">
                ❌ Ejaan belum cocok! Cek suku kata: <span class="underline">${wordObj.syllables}</span> lalu ketik ulang.
              </div>
            ` : ''}

            <div class="text-center">
              <button type="submit" class="nb-btn bg-[#39FF14] px-8 py-3.5 font-pixel text-xs sm:text-sm">
                KIRIM EJAAN ↵
              </button>
            </div>
          </form>
        `;
      }

      return `
        ${renderNavbar()}
        <main class="flex-1 max-w-3xl mx-auto w-full px-4 py-6 space-y-5">
          <!-- Quest Header -->
          <div class="nb-card p-4 bg-white space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span class="px-3 py-1 border-2 border-black rounded font-pixel text-[10px] sm:text-xs ${q.stage === 3 ? 'text-white' : 'text-black'}" style="background:${stageColors[q.stage]};">
                ${stageNames[q.stage]}
              </span>
              <div class="flex items-center gap-2">
                <span class="font-mono-brutal text-xs font-extrabold px-2.5 py-1 bg-[#FFE600] border-2 border-black rounded">
                  SKOR: ${q.score}
                </span>
                <span class="font-mono-brutal text-xs font-extrabold px-2.5 py-1 bg-[#00F0FF] border-2 border-black rounded">
                  SOAL ${q.qIndex + 1}/${folder.words.length}
                </span>
              </div>
            </div>

            <div class="nb-progress-track h-4 w-full">
              <div class="nb-progress-fill bg-[#39FF14]" style="width: ${questPercent}%"></div>
            </div>
          </div>

          <!-- Active Question Card -->
          <div class="nb-card-lg p-6 sm:p-8 bg-white animate-pop">
            ${stageBodyHtml}
          </div>

          <div class="flex justify-between items-center">
            <button onclick="State.view='STUDY_MODE'; SoundFX.click(); render();" class="nb-btn bg-white px-4 py-2 text-xs">
              📖 BUKA KARTU BELAJAR
            </button>
            <span class="text-xs font-bold text-gray-600">Folder #${folder.id}: ${folder.title}</span>
          </div>
        </main>
      `;
    }

    // ---------- VIEW 6: TEACHER DASHBOARD (MEMANTAU PROGRESS SISWA) ----------
    function renderTeacherDashboard() {
      const enriched = State.students.map(s => ({
        ...s,
        stats: computeStudentStats(s),
        currentFolderObj: CURRICULUM.find(f => f.id === s.unlockedFolderId) || CURRICULUM[CURRICULUM.length - 1]
      }));

      // Aggregate KPIs
      const totalStudents = enriched.length;
      const avgScore = totalStudents
        ? Math.round(enriched.reduce((sum, s) => sum + s.stats.totalScore, 0) / totalStudents)
        : 0;
      const avgFolders = totalStudents
        ? (enriched.reduce((sum, s) => sum + s.stats.completedCount, 0) / totalStudents).toFixed(1)
        : 0;
      const avgAccuracy = totalStudents
        ? Math.round(enriched.reduce((sum, s) => sum + s.stats.avgAccuracy, 0) / totalStudents)
        : 0;

      // Filter & Sort
      const classes = ['ALL', '7', '8', '9', 'UMUM'];
      let filtered = enriched.filter(s => {
        const matchClass = State.teacherFilterClass === 'ALL' || s.className === State.teacherFilterClass;
        const matchSearch = s.name.toLowerCase().includes(State.teacherSearch.toLowerCase());
        return matchClass && matchSearch;
      });

      filtered.sort((a, b) => {
        if (State.teacherSortBy === 'SCORE') return b.stats.totalScore - a.stats.totalScore;
        if (State.teacherSortBy === 'PROGRESS') return b.stats.completedCount - a.stats.completedCount;
        return a.username.localeCompare(b.username);
      });

      const studentRowsHtml = filtered.map(s => {
        const av = getAvatarObj(s.avatar);
        return `
          <div class="nb-card p-4 bg-white flex flex-col md:flex-row md:items-center justify-between gap-4">
            <!-- Student Identity -->
            <div class="flex items-center gap-3 min-w-[210px]">
              <div class="w-12 h-12 border-3 border-black rounded flex items-center justify-center text-2xl shrink-0" style="background:${av.bg}; border-width:3px;">
                ${av.emoji}
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-extrabold text-base">@${s.username}</span>
                  <span class="font-mono-brutal text-[11px] font-bold px-2 py-0.5 bg-[#FFE600] border-2 border-black rounded">
                    KELAS ${s.className}
                  </span>
                </div>
                <div class="text-xs font-semibold text-gray-600 mt-0.5">
                  Posisi: <strong>Lv.${s.currentFolderObj.level} #${s.currentFolderObj.id} ${s.currentFolderObj.title}</strong> • <span class="text-gray-500">${s.lastActive}</span>
                </div>
              </div>
            </div>

            <!-- Progress Bar -->
            <div class="flex-1 max-w-md">
              <div class="flex justify-between text-xs font-extrabold mb-1">
                <span>Progress: ${s.stats.completedCount}/21 Folder</span>
                <span>${s.stats.progressPercent}%</span>
              </div>
              <div class="nb-progress-track h-4 w-full">
                <div class="nb-progress-fill bg-[#00F0FF]" style="width: ${s.stats.progressPercent}%"></div>
              </div>
            </div>

            <!-- Score, Accuracy & Action -->
            <div class="flex flex-wrap items-center justify-between md:justify-end gap-3">
              <div class="text-right">
                <div class="font-mono-brutal font-extrabold text-sm bg-black text-[#39FF14] px-2.5 py-1 rounded">
                  ${s.stats.totalScore} XP
                </div>
                <div class="text-[11px] font-bold text-gray-700 mt-0.5">Akurasi: ${s.stats.avgAccuracy}%</div>
              </div>
              <button onclick="openStudentDetailModal('${s.id}')" class="nb-btn bg-[#FFE600] px-3.5 py-2.5 text-xs">
                DETAIL 🔍
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        ${renderNavbar()}
        <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-6 space-y-6">
          <!-- Header Banner -->
          <div class="nb-card-lg p-5 sm:p-6 bg-[#B57EDC] flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span class="font-pixel text-[10px] bg-white px-2.5 py-1 border-2 border-black">TEACHER MONITORING PORTAL</span>
              <h1 class="font-pixel text-lg sm:text-xl mt-2">DASHBOARD PROGRESS SISWA</h1>
              <p class="text-xs sm:text-sm font-bold mt-1">Pantau penguasaan vocabulary, folder terbuka, dan akurasi ejaan setiap siswa.</p>
            </div>
            <button onclick="exportTeacherCSV()" class="nb-btn bg-[#39FF14] px-4 py-3 text-xs shrink-0">
              📥 UNDUH LAPORAN CSV
            </button>
          </div>

          <!-- 4 KPI Cards -->
          <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="nb-card p-4 bg-white">
              <div class="text-xs font-extrabold text-gray-600">TOTAL SISWA AKTIF</div>
              <div class="font-pixel text-2xl mt-2">${totalStudents}</div>
              <div class="text-xs font-bold text-emerald-700 mt-1">Terdaftar di Kelas</div>
            </div>
            <div class="nb-card p-4 bg-[#FFE600]">
              <div class="text-xs font-extrabold">RATA-RATA SKOR XP</div>
              <div class="font-pixel text-2xl mt-2">${avgScore}</div>
              <div class="text-xs font-bold mt-1">Poin Akumulasi Quest</div>
            </div>
            <div class="nb-card p-4 bg-[#00F0FF]">
              <div class="text-xs font-extrabold">RATA-RATA FOLDER</div>
              <div class="font-pixel text-2xl mt-2">${avgFolders} / 21</div>
              <div class="text-xs font-bold mt-1">Folder Diselesaikan</div>
            </div>
            <div class="nb-card p-4 bg-[#39FF14]">
              <div class="text-xs font-extrabold">RATA-RATA AKURASI</div>
              <div class="font-pixel text-2xl mt-2">${avgAccuracy}%</div>
              <div class="text-xs font-bold mt-1">Ketepatan Ejaan Kata</div>
            </div>
          </section>

          <!-- Filter & Search Controls -->
          <section class="nb-card p-4 bg-white flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-xs font-extrabold mr-1">FILTER KELAS:</span>
              ${classes.map(cls => `
                <button
                  onclick="State.teacherFilterClass='${cls}'; SoundFX.click(); render();"
                  class="nb-btn px-3 py-1.5 text-xs ${State.teacherFilterClass === cls ? 'bg-[#FFE600]' : 'bg-gray-100'}"
                >
                  ${cls === 'ALL' ? 'SEMUA KELAS' : 'KELAS ' + cls}
                </button>
              `).join('')}
            </div>

            <div class="flex flex-col sm:flex-row gap-2">
              <input
                type="text"
                value="${State.teacherSearch}"
                oninput="State.teacherSearch = this.value; render();"
                placeholder="Cari nama siswa..."
                class="nb-input px-3 py-2 text-xs font-bold"
              />
              <select
                onchange="State.teacherSortBy = this.value; render();"
                class="nb-input px-3 py-2 text-xs font-bold"
              >
                <option value="SCORE" ${State.teacherSortBy === 'SCORE' ? 'selected' : ''}>Urutkan: Skor Tertinggi</option>
                <option value="PROGRESS" ${State.teacherSortBy === 'PROGRESS' ? 'selected' : ''}>Urutkan: Folder Terbanyak</option>
                <option value="NAME" ${State.teacherSortBy === 'NAME' ? 'selected' : ''}>Urutkan: Nama A-Z</option>
              </select>
            </div>
          </section>

          <!-- Student Cards List -->
          <section class="space-y-3">
            ${studentRowsHtml || `
              <div class="nb-card p-8 bg-white text-center space-y-3">
                <div class="font-bold text-gray-700">
                  ${State.students.length === 0
                    ? 'Belum ada siswa yang login menggunakan username di database.'
                    : 'Tidak ada siswa yang sesuai dengan filter pencarian.'}
                </div>
                ${State.students.length === 0 ? `
                  <button onclick="seedDemoStudentsToFirestore()" class="nb-btn bg-[#FFE600] px-4 py-2.5 text-xs">
                    ➕ MUAT 3 DATA SISWA CONTOH
                  </button>
                ` : ''}
              </div>
            `}
          </section>
        </main>
      `;
    }

    /* ==========================================================================
       11. KEYBOARD SHORTCUTS & MASTER RENDER LOOP
       ========================================================================== */
    window.addEventListener('keydown', (e) => {
      if (State.view !== 'QUEST_MODE' || !State.quest) return;
      const q = State.quest;
      // Support physical keyboard typing during Stage 1 Anagram
      if (q.stage === 1 && q.feedbackState !== 'CORRECT') {
        const key = e.key.toUpperCase();
        if (/^[A-Z]$/.test(key)) {
          const item = q.anagramPool[q.qIndex];
          const matchingTile = item.tiles.find(t => !t.used && t.char === key);
          if (matchingTile) handleAnagramTilePick(matchingTile.id);
        } else if (e.key === 'Backspace') {
          const item = q.anagramPool[q.qIndex];
          if (item.selectedTileIds.length > 0) {
            handleAnagramSlotRemove(item.selectedTileIds.length - 1);
          }
        } else if (e.key === 'Enter') {
          submitQuestAnswer();
        }
      }
    });

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      switch (State.view) {
        case 'LOGIN':
          app.innerHTML = renderLoginView();
          break;
        case 'STUDENT_HUB':
          app.innerHTML = renderStudentHub();
          break;
        case 'STUDY_MODE':
          app.innerHTML = renderStudyMode();
          break;
        case 'QUEST_MODE':
          app.innerHTML = renderQuestMode();
          if (State.quest?.stage === 3) {
            const inp = document.getElementById('typing-quest-input');
            if (inp) inp.focus();
          }
          break;
        case 'QUEST_COMPLETE':
          app.innerHTML = renderQuestCompleteView();
          break;
        case 'TEACHER_DASHBOARD':
          app.innerHTML = renderTeacherDashboard();
          break;
        default:
          app.innerHTML = renderLoginView();
      }
    }

    // Expose interactive handlers to window for inline HTML events in module script
    Object.assign(window, {
      State,
      SoundFX,
      CURRICULUM,
      render,
      speakWord,
      handleStudentLogin,
      quickLoginExistingStudent,
      handleTeacherLogin,
      logoutToHome,
      startFolderStudy,
      startFolderQuest,
      handleAnagramTilePick,
      handleAnagramSlotRemove,
      clearAnagramSelection,
      submitQuestAnswer,
      toggleMultipleChoiceHint,
      openStudentDetailModal,
      closeModal,
      exportTeacherCSV,
      seedDemoStudentsToFirestore
    });

    // Initialize Application & Firebase Backend on Load
    window.onload = function () {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
      }
      render();
      initFirebaseBackend();
    };
  </script>
</body>
</html>
